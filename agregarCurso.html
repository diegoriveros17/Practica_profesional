<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AllCursos - Formulario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="d-flex flex-column h-100" id="page-container-1">
    <header data-bs-theme="dark">
      <nav
        class="navbar navbar-expand-lg bg-body-tertiary fixed-top"
        aria-label="Thirteenth navbar example"
      >
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
            aria-controls="navbarsExample11"
            aria-expanded="true"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <ul class="navbar-nav fw-bold col-lg-6">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="login.html">Iniciar Sesión</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="formulario_registro.html">Registrate</a>
              </li>
              <li class="nav-item">
                <span class="nav-link" id="usuarioNombre"></span>
              </li>
            </ul>
            <div class="col-lg-4">
              <form class="d-flex" role="search" id="formBuscar">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Buscar"
                  aria-label="Search"
                  name="terminoBusqueda"
                  id="terminoBusqueda"
                />
                <button class="btn btn-outline-success" type="submit">
                  Buscar
                </button>
              </form>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-shrink-0 mt-5 pt-5">
      <section class="py-3 container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <h2 class="mb-4 text-center">Formulario de Detalle del Curso</h2>
            <form id="formCurso" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="nombreCurso" class="form-label">Nombre del Curso</label>
                <input type="text" class="form-control" id="nombreCurso" value="Desarrollo Web Full Stack" required>
              </div>
              <div class="mb-3">
                <label for="descripcionCurso" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcionCurso" rows="3" required>Aprende HTML, CSS, JavaScript y Bootstrap desde cero hasta nivel avanzado.</textarea>
              </div>
              <div class="mb-3">
                <label for="categoriaCurso" class="form-label">Categoría</label>
                <select class="form-select" id="categoriaCurso" required>
                  <option value="Programacion" selected>Programación</option>
                  <option value="Diseno">Diseño</option>
                  <option value="Marketing">Marketing</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="precioCurso" class="form-label">Precio ($)</label>
                <input type="number" class="form-control" id="precioCurso" value="49.99" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Guardar Cambios</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-white bg-black py-3 mt-auto">
      <div class="container text-center">
        <p class="mb-0">&copy; AllCursos 2026</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
